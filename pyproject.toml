[project]
name = "knowme-agent"
version = "0.1.4"
description = "A minimal, transparent, local-first KnowMe: harness + loop + memory + eval, in code you can read in an afternoon."
readme = "README.md"
license = { text = "MIT" }
authors = []
requires-python = ">=3.11"
keywords = ["ai-agent", "llm", "agent-framework", "local-first", "llmops", "memory", "eval"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "anthropic>=0.40",   # anthropic wire format: Anthropic, Kimi, GLM, MiniMax
    "openai>=1.50",      # openai wire format: OpenAI, Gemini, DeepSeek (and embeddings)
    "python-dotenv>=1.0",
    "rich>=13.0",
    # The Reader's PDF branch. It used to be an undeclared optional import, so
    # it raised "请先安装 pypdf" in every install that did not happen to have it
    # — the document library needs the extracted text of a PDF, not just its
    # bytes, so this is a real dependency now rather than a hopeful one.
    "pypdf>=5.0",
]

[project.scripts]
# Branded CLI: `knowme web`, or bare `knowme` to chat.
knowme = "knowme.__main__:main"

[project.optional-dependencies]
# Eval pillar: LLM-as-judge (deterministic evals need only pytest)
eval = [
    "pytest>=8.0",
    "deepeval>=2.0",
]
# LLM-Ops pillar: local trace web (traces also always land in traces/*.jsonl)
tracing = [
    "arize-phoenix>=7.0",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp>=1.27",
]
# Optional write-through target for create_event; the local SQLite/ICS mock
# remains the default and source of truth.
gcal = [
    "google-api-python-client>=2.0",
    "google-auth>=2.0",
    "google-auth-httplib2>=0.2",
    "httplib2>=0.22",
    # The browser consent flow. Without it the only way in is `gcloud auth
    # application-default login`, which is a developer ritual, not a sign-in.
    "google-auth-oauthlib>=1.0",
]
# Optional semantic-memory upgrade path: Supabase pgvector (see launch-rag)
supabase = [
    "supabase>=2.0",
]
# Optional hosted semantic-memory backends. SQLite FTS5 remains the default.
memory-backends = [
    "mem0ai>=2.0",
    "zep-cloud>=2.0",
    "langmem>=0.0.30",
    "langgraph>=0.3",
]
# Optional episodic-memory backend: Notion database
# Requires >=2.5: the adapter uses the data_sources API (Notion API 2025-09-03).
notion = [
    "notion-client>=2.5",
]
# Optional: connect MCP servers (.knowme/mcp.json)
mcp = [
    "mcp>=1.0",
]
dev = [
    "pytest>=8.0",
    # Pinned EXACTLY: an unpinned linter means every ruff release can turn CI
    # red with zero code changes (happened 2026-07-24 — 0.16.0 shipped new
    # rules and 106 violations appeared overnight). Bump deliberately.
    "ruff==0.16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# An sdist should be what you need to BUILD and TEST knowme — source, bundled
# skills, schema, evals. Left alone it was 2.6 MB, and 2.5 MB of that was a
# whiteboard PNG and the .excalidraw sources, plus local agent tooling that only
# matters inside this repo. All of it stays in the checkout,
# where people actually read it; none of it belongs in a package download.
[tool.hatch.build.targets.sdist]
exclude = [
    "docs", "examples",
    ".agents", ".deepeval",
]

[tool.hatch.build.targets.wheel]
packages = ["knowme"]

# The bundled skills live at the repo root because that is where contributors
# add them (`skills/community/`).
# But `packages = ["knowme"]` ships only the package, so before 2026-07-31 a
# `pip install knowme-agent` arrived with ZERO skills — procedural memory, one of
# the four pillars, silently absent while the web shipped fine (it lives
# under knowme/ops/static). Copying them in at build time keeps one contributor-
# facing location and still ships them; knowme.memory.bundled_skill_dirs() looks
# in both places and explains why.
[tool.hatch.build.targets.wheel.force-include]
"skills" = "knowme/skills"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Rules knowme IGNORES on purpose — each is a deliberate style choice, not an
# oversight. If you're tempted to remove one, read the reason first:
ignore = [
    "BLE001",  # blind `except Exception` is the documented pattern: tools and
               # observers surface errors as text instead of crashing the loop
    "DTZ001", "DTZ005", "DTZ011",  # naive local datetimes are intentional —
               # daily trace files and workspace folders are named in the
               # user's local day, not UTC
    "S110",    # try/except/pass around optional integrations (OTel, extras)
    # RUF100 flags a `# noqa` for a rule that is no longer enabled. Because the
    # rules above are globally ignored, ANY `# noqa: BLE001` a contributor
    # writes — the natural, correct-looking thing to write next to a broad
    # `except Exception` — becomes a CI failure in a file they never touched.
    # That footgun blocked two community PRs (#14, #26) on 2026-07-26. Turning
    # RUF100 off costs us the ability to spot genuinely stale noqas; leaving it
    # on costs contributors a red CI they can't explain. Contributors win.
    "RUF100",
]

[tool.ruff.lint.per-file-ignores]
# A test that drives a subprocess and then asserts on `returncode` is doing the
# OPPOSITE of what PLW1510 asks for: `check=True` would raise on a non-zero exit
# and throw away the captured stderr, which is exactly what the assertion message
# needs. Eleven explicit `check=False` keywords would say the same thing less
# clearly. (These files were invisible to ruff until Phase 49: .gitignore ignored
# evals/* and ruff respects .gitignore, so it never looked at them.)
"evals/**" = ["PLW1510"]
