<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KnowMe</title>
<link rel="stylesheet" href="/static/style.css"></head><body>
<nav id="nav">
  <div class="brand">KnowMe<small id="model" style="cursor:pointer" title="点击切换模型" onclick="location.hash='#models'"></small>
    <button id="nav-toggle" title="隐藏侧栏">&#10094;</button></div>
  <div class="grp">Agents</div>
  <!-- Clicking an agent NAVIGATES to #agent/<id> (openAgent), it no longer just
       swaps the contents of a side column. Back button works because of that. -->
  <button class="agent-link" data-agent="default" onclick="openAgent('default')"><span class="agent-icon">✦</span><span>General</span><i></i></button>
  <button class="agent-link" data-agent="coding" onclick="openAgent('coding')"><span class="agent-icon">⌘</span><span>Coding</span><i></i></button>
  <button class="agent-link" data-agent="learning" onclick="openAgent('learning')"><span class="agent-icon">◈</span><span>Learning</span><i></i></button>
  <button class="agent-link" data-agent="research" onclick="openAgent('research')"><span class="agent-icon">◎</span><span>Research</span><i></i></button>
  <button class="agent-link" data-agent="reader" onclick="openAgent('reader')"><span class="agent-icon">❖</span><span>Reader</span><i></i></button>
  <div class="grp">Applications</div>
  <a href="#reader" data-v="reader">阅读器 · 文档库</a>
  <a href="#knowledge" data-v="knowledge">知识库</a>
  <a href="#memory" data-v="memory">记忆管理</a>
  <a href="#coding" data-v="coding">Coding Workspace</a>
  <div class="grp">Manage</div>
  <a href="#overview" data-v="overview">总览</a>
  <a href="#gateway" data-v="gateway">网关 <span class="n" id="n-gw"></span></a>
  <a href="#loop" data-v="loop">循环 <span class="n" id="n-loop"></span></a>
  <a href="#graph" data-v="graph">图工作流 <span class="n" id="n-graph"></span></a>
  <a href="#memory" data-v="memory">记忆数据 <span class="n" id="n-mem"></span></a>
  <a href="#tools" data-v="tools">工具 <span class="n" id="n-tools"></span></a>
  <a href="#database" data-v="database">数据库 <span class="n" id="n-db"></span></a>
  <a href="#ops" data-v="ops">运维 <span class="n" id="n-ops"></span></a>
  <div class="grp">设置</div>
  <a href="#models" data-v="models">模型</a>
  <a href="#connections" data-v="connections">连接</a>
  <a href="#settings" data-v="settings">行为</a>
</nav>
<div class="resizer" id="nav-resizer" title="拖动调整侧栏宽度"></div>
<main>
  <header class="pagehead">
    <h1 id="title">总览</h1>
    <div class="sub" id="sub"></div>
  </header>
  <div id="view"></div>
</main>
<button id="nav-reopen" title="显示侧栏">&#9776;</button>
<!-- Frontend is split into focused classic scripts sharing one global scope
     (no build step, no modules). Order matters only in that main.js runs the
     bootstrap and must load LAST. See static/README.md for the file map. -->
<script src="/static/js/util.js"></script>
<script src="/static/js/memory.js"></script>
<script src="/static/js/models.js"></script>
<script src="/static/js/render.js"></script>
<script src="/static/js/trace.js"></script>
<script src="/static/js/diagram.js"></script>
<script src="/static/js/graph.js"></script>
<script src="/static/js/views.js"></script>
<script src="/static/js/chat.js"></script>
<script src="/static/js/reader.js"></script>
<script src="/static/js/knowledge.js"></script>
<script src="/static/js/main.js"></script></body></html>
